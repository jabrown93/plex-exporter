name: Release

on:
  push:
    branches:
      - main
  # Weekly roll-up of the fix(deps) commits that the shared preset suppresses
  # on push, promoted into a single patch release (RELEASE_DEPS).
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — weekly dependency roll-up
  # Also sets RELEASE_DEPS, so a manual run is an on-demand dependency sweep.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jabrown93/ci/.github/workflows/docker-release.yml@b70e41bf036b757899993918c1788f38c3c472fc # workflows-v3.0.0
    permissions:
      contents: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  image:
    name: Build & push image
    needs: release
    # This job MUST live here, in this repo's own workflow file -- not inside
    # another reusable workflow -- so cosign's keyless-signing Fulcio cert's
    # SAN is THIS repo's identity, not jabrown93/ci's. That SAN is what the
    # verify-ghcr-images Kyverno policy trusts. See jabrown93/ci's README
    # (actions/docker-image) for the full explanation.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: jabrown93/ci/actions/docker-image@3b3f9d74d9c06b48e8f7e1cc9ae8bacf927ca1b4 # docker-image-v1.0.0
        with:
          image: ghcr.io/jabrown93/plex-exporter
          version: ${{ needs.release.outputs.version }}
          channel: ${{ needs.release.outputs.channel }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
